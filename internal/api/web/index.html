<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solix F2000 Monitor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='8' y='18' width='44' height='28' rx='6' fill='%23222b36' stroke='%233fb950' stroke-width='4'/%3E%3Crect x='52' y='26' width='6' height='12' rx='2' fill='%233fb950'/%3E%3Cpath d='M30 22L20 36h9l-3 10 12-16h-9l1-8z' fill='%233fb950'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/chart.js@2.9.4/dist/Chart.min.js"></script>
<style>
  :root {
    --bg: #0f1419;
    --panel: #1a2029;
    --panel-2: #222b36;
    --text: #e6edf3;
    --muted: #8b98a5;
    --accent: #3fb950;
    --warn: #f0883e;
    --danger: #f85149;
    --blue: #58a6ff;
    --border: #2d3743;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }
  h1 { font-size: 1.3rem; margin: 0; }
  .status-line { font-size: 0.85rem; color: var(--muted); }
  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 0.75rem;
    font-weight: 600;
  }
  .badge.ok { background: rgba(63,185,80,0.15); color: var(--accent); }
  .badge.stale { background: rgba(248,81,73,0.15); color: var(--danger); }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  @media (min-width: 768px) and (orientation: landscape) {
    .cards { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
  }
  .card .label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .card .value { font-size: 1.6rem; font-weight: 700; margin-top: 4px; }
  .card .unit { font-size: 0.9rem; color: var(--muted); font-weight: 400; }
  .battery-fill { height: 6px; border-radius: 3px; background: var(--panel-2); margin-top: 8px; overflow: hidden; }
  .battery-fill > span { display: block; height: 100%; background: var(--accent); transition: width 0.4s; }
  .controls { margin-bottom: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  .controls button {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 14px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  .controls button.active { background: var(--blue); color: #0f1419; border-color: var(--blue); font-weight: 600; }
  .charts { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 900px) { .charts { grid-template-columns: 1fr 1fr; } }
  .chart-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
  .chart-panel h3 { margin: 0 0 10px; font-size: 0.95rem; color: var(--muted); font-weight: 600; }
  canvas { max-height: 240px; }
  .chart-panel--gauge canvas { max-height: 200px; }
  footer { margin-top: 20px; font-size: 0.75rem; color: var(--muted); text-align: center; }

  /* Drag-and-drop */
  .card[draggable], .chart-panel[draggable] { cursor: grab; }
  .card[draggable]:active, .chart-panel[draggable]:active { cursor: grabbing; }
  .drag-over { outline: 2px dashed var(--blue); outline-offset: 2px; }
  .dragging { opacity: 0.4; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Solix F2000 Monitor</h1>
    <div class="status-line" id="statusLine">Loading…</div>
  </div>
  <div id="connBadge" class="badge ok">—</div>
</header>

<section class="cards" id="cards">
  <div class="card" draggable="true" data-id="card-battery">
    <div class="label">Battery</div>
    <div class="value" id="battery">—<span class="unit">%</span></div>
    <div class="battery-fill"><span id="batteryFill" style="width:0%"></span></div>
  </div>
  <div class="card" draggable="true" data-id="card-solar"><div class="label">Solar In</div><div class="value" id="solar">—<span class="unit">W</span></div></div>
  <div class="card" draggable="true" data-id="card-acin"><div class="label">AC In</div><div class="value" id="acIn">—<span class="unit">W</span></div></div>
  <div class="card" draggable="true" data-id="card-acout"><div class="label">AC Out</div><div class="value" id="acOut">—<span class="unit">W</span></div></div>
  <div class="card" draggable="true" data-id="card-dcout"><div class="label">DC Out</div><div class="value" id="dcOut">—<span class="unit">W</span></div></div>
  <div class="card" draggable="true" data-id="card-temp"><div class="label">Temperature</div><div class="value" id="temp">—<span class="unit">°C</span></div></div>
  <div class="card" draggable="true" data-id="card-est-remaining"><div class="label">Est. Time Remaining</div><div class="value" id="estRemaining">—</div></div>
</section>

<div class="controls" id="rangeControls">
  <button data-hours="1">1h</button>
  <button data-hours="6">6h</button>
  <button data-hours="24">24h</button>
  <button data-hours="168">7d</button>
</div>

<section class="charts" id="charts">
  <div class="chart-panel" draggable="true" data-id="chart-battery"><h3>Battery %</h3><canvas id="chartBattery"></canvas></div>
  <div class="chart-panel" draggable="true" data-id="chart-solar"><h3>Solar Power (W)</h3><canvas id="chartSolar"></canvas></div>
  <div class="chart-panel" draggable="true" data-id="chart-acout"><h3>AC Output (W)</h3><canvas id="chartAcOut"></canvas></div>
  <div class="chart-panel" draggable="true" data-id="chart-acin"><h3>AC Input (W)</h3><canvas id="chartAcIn"></canvas></div>
  <div class="chart-panel" draggable="true" data-id="chart-dcout"><h3>DC Output (W)</h3><canvas id="chartDcOut"></canvas></div>
  <div class="chart-panel" draggable="true" data-id="chart-usb"><h3>USB Power Out (W)</h3><canvas id="chartUsb"></canvas></div>
  <div class="chart-panel" draggable="true" data-id="chart-temp"><h3>Temperature (°C)</h3><canvas id="chartTemp"></canvas></div>
  <div class="chart-panel chart-panel--gauge" draggable="true" data-id="chart-health"><h3>Battery Health (%)</h3><canvas id="chartBatteryHealth"></canvas></div>
</section>

<footer>Auto-refreshes every 30s · <span id="lastUpdate">—</span></footer>

<script>
(function () {
  var STALE_MS = 3 * 60 * 1000;
  var rangeHours = 6;
  var charts = {};
  var chartRequestSeq = 0;
  var chartIsV2 = false;

  function fmt(v, dash) {
    if (dash === undefined) dash = "—";
    return (v === null || v === undefined) ? dash : v;
  }

  function isFiniteNumber(v) {
    return typeof v === "number" && isFinite(v);
  }

  function zeroPad2(v) {
    return ("0" + v).slice(-2);
  }

  function fmtDurationHours(hours) {
    if (!isFiniteNumber(hours) || hours <= 0) return "—";
    var minsTotal = Math.round(hours * 60);
    if (minsTotal < 60) return minsTotal + "m";
    var h = Math.floor(minsTotal / 60);
    var m = minsTotal % 60;
    return m === 0 ? (h + "h") : (h + "h " + m + "m");
  }

  function updateEstimatedTimeRemaining(rows) {
    var el = document.getElementById("estRemaining");
    if (!el) return;
    if (!rows || typeof rows.length !== "number" || rows.length < 2) {
      el.textContent = "—";
      return;
    }

    var points = [];
    var i;
    for (i = 0; i < rows.length; i++) {
      var row = rows[i];
      var tsMs = new Date(row.timestamp).getTime();
      if (isFiniteNumber(tsMs) && row.battery_percent != null) {
        points.push({ row: row, tsMs: tsMs });
      }
    }
    if (points.length < 2) {
      el.textContent = "—";
      return;
    }

    var latestTsMs = points[0].tsMs;
    for (i = 1; i < points.length; i++) {
      if (points[i].tsMs > latestTsMs) latestTsMs = points[i].tsMs;
    }
    var windowStartMs = latestTsMs - (5 * 60 * 1000);
    var recent = [];
    for (i = 0; i < points.length; i++) {
      if (points[i].tsMs >= windowStartMs) recent.push(points[i]);
    }
    recent.sort(function (a, b) { return a.tsMs - b.tsMs; });
    if (recent.length < 2) {
      el.textContent = "—";
      return;
    }

    var oldestPoint = recent[0];
    var newestPoint = recent[recent.length - 1];
    var elapsedMs = newestPoint.tsMs - oldestPoint.tsMs;
    if (!isFiniteNumber(elapsedMs) || elapsedMs <= 0) {
      el.textContent = "—";
      return;
    }

    var dischargePct = oldestPoint.row.battery_percent - newestPoint.row.battery_percent;
    if (!isFiniteNumber(dischargePct)) {
      el.textContent = "—";
      return;
    }
    if (dischargePct < -0.1) {
      el.textContent = "Charging";
      return;
    }
    if (dischargePct <= 0.1) {
      el.textContent = "—";
      return;
    }

    var dischargeRatePctPerHour = dischargePct / (elapsedMs / (60 * 60 * 1000));
    if (!isFiniteNumber(dischargeRatePctPerHour) || dischargeRatePctPerHour <= 0) {
      el.textContent = "—";
      return;
    }

    var remainingHours = newestPoint.row.battery_percent / dischargeRatePctPerHour;
    var display = fmtDurationHours(remainingHours);
    el.textContent = display;
  }

  function fetchJSON(url) {
    if (typeof window.fetch === "function") {
      return window.fetch(url).then(function (res) {
        if (!res.ok) throw new Error(url + " -> " + res.status);
        return res.json();
      });
    }

    return new Promise(function (resolve, reject) {
      var xhr = new XMLHttpRequest();
      xhr.open("GET", url, true);
      xhr.onreadystatechange = function () {
        if (xhr.readyState !== 4) return;
        if (xhr.status < 200 || xhr.status >= 300) {
          reject(new Error(url + " -> " + xhr.status));
          return;
        }
        try {
          resolve(JSON.parse(xhr.responseText));
        } catch (e) {
          reject(e);
        }
      };
      xhr.onerror = function () {
        reject(new Error(url + " -> network error"));
      };
      xhr.send();
    });
  }

  function setBadge(connected, ts) {
    var badge = document.getElementById("connBadge");
    var age = ts ? (Date.now() - new Date(ts).getTime()) : Infinity;
    var stale = !connected || age > STALE_MS;
    if (stale) {
      badge.className = "badge stale";
      badge.textContent = connected ? "STALE" : "DISCONNECTED";
    } else {
      badge.className = "badge ok";
      badge.textContent = "CONNECTED";
    }
  }

  function refreshStatus() {
    var status = null;
    var health = null;
    fetchJSON("/api/status")
      .then(function (s) {
        status = s;
      })
      .catch(function () {
        status = null;
      })
      .then(function () {
        return fetchJSON("/api/health")
          .then(function (h) {
            health = h;
          })
          .catch(function () {
            health = null;
          });
      })
      .then(function () {
        if (status) {
          document.getElementById("battery").innerHTML = fmt(status.battery_percent) + '<span class="unit">%</span>';
          document.getElementById("batteryFill").style.width = (status.battery_percent || 0) + "%";
          document.getElementById("solar").innerHTML = fmt(status.solar_power_w) + '<span class="unit">W</span>';
          document.getElementById("acIn").innerHTML = fmt(status.ac_power_in_w) + '<span class="unit">W</span>';
          document.getElementById("acOut").innerHTML = fmt(status.ac_power_out_w) + '<span class="unit">W</span>';
          var dc = (status.dc1_power_out_w || 0) + (status.dc2_power_out_w || 0);
          document.getElementById("dcOut").innerHTML = dc + '<span class="unit">W</span>';
          document.getElementById("temp").innerHTML = fmt(status.temperature_c) + '<span class="unit">°C</span>';
          document.getElementById("lastUpdate").textContent = "Last data: " + new Date(status.timestamp).toLocaleString();

          if (charts.batteryHealth) {
            var bh = status.battery_health || 0;
            charts.batteryHealth.data.datasets[0].data = [bh, 100 - bh];
            charts.batteryHealth.update();
          }
        }

        var connected = health ? !!health.ble_connected : false;
        var ts = status ? status.timestamp : null;
        setBadge(connected, ts);

        var parts = [];
        if (health) {
          parts.push("BLE " + (health.ble_connected ? "connected" : "disconnected"));
          parts.push("DB " + (health.db_ok ? "ok" : "error"));
          if (health.uptime_seconds != null) parts.push("uptime " + Math.floor(health.uptime_seconds / 60) + "m");
          if (health.last_error) parts.push("err: " + health.last_error);
        }
        document.getElementById("statusLine").textContent = parts.join(" · ") || "No health data";
      })
      .catch(function (e) {
        document.getElementById("statusLine").textContent = "Error: " + e.message;
      });
  }

  function lineChartOptions(showLegend) {
    if (chartIsV2) {
      return {
        responsive: true,
        maintainAspectRatio: false,
        legend: {
          display: !!showLegend,
          labels: { fontColor: "#8b98a5", boxWidth: 12, fontSize: 11 }
        },
        scales: {
          xAxes: [{ ticks: { fontColor: "#8b98a5", maxTicksLimit: 6, autoSkip: true }, gridLines: { color: "#2d3743" } }],
          yAxes: [{ ticks: { fontColor: "#8b98a5", beginAtZero: true }, gridLines: { color: "#2d3743" } }]
        }
      };
    }
    return {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: !!showLegend, labels: { color: "#8b98a5", boxWidth: 12, font: { size: 11 } } } },
      scales: {
        x: { ticks: { color: "#8b98a5", maxTicksLimit: 6, autoSkip: true }, grid: { color: "#2d3743" } },
        y: { ticks: { color: "#8b98a5" }, grid: { color: "#2d3743" }, beginAtZero: true }
      }
    };
  }

  function buildChart(id, color) {
    var ctx = document.getElementById(id).getContext("2d");
    return new Chart(ctx, {
      type: "line",
      data: { labels: [], datasets: [{ data: [], borderColor: color, backgroundColor: color + "33", fill: true, pointRadius: 0, borderWidth: 2, tension: 0.25, lineTension: 0.25 }] },
      options: lineChartOptions(false),
    });
  }

  function buildMultiChart(id, datasets) {
    var ctx = document.getElementById(id).getContext("2d");
    return new Chart(ctx, {
      type: "line",
      data: {
        labels: [],
        datasets: datasets.map(function (d) {
          return {
            label: d.label,
            data: [],
            borderColor: d.color,
            backgroundColor: d.color + "33",
            fill: false,
            pointRadius: 0,
            borderWidth: 2,
            tension: 0.25,
            lineTension: 0.25
          };
        }),
      },
      options: lineChartOptions(true),
    });
  }

  function buildGauge(id) {
   var ctx = document.getElementById(id).getContext("2d");
   var gaugeCirc = chartIsV2 ? Math.PI : 180;
   var gaugeRotation = chartIsV2 ? Math.PI : 270;
   return new Chart(ctx, {
     type: "doughnut",
     data: {
       datasets: [{
         data: [0, 100],
         backgroundColor: ["#3fb950", "#2d3743"],
         borderWidth: 0,
         circumference: gaugeCirc,
         rotation: gaugeRotation,
       }],
     },
     options: chartIsV2 ? {
       responsive: true,
       maintainAspectRatio: false,
       cutoutPercentage: 70,
       legend: { display: false },
       tooltips: { enabled: false },
     } : {
       responsive: true,
       maintainAspectRatio: false,
       cutout: "70%",
       plugins: {
         legend: { display: false },
         tooltip: { enabled: false },
       },
     },
     plugins: [{
        id: "gaugeLabel",
        afterDraw: function (chart) {
          var c = chart.ctx;
          var left = chart.chartArea.left;
          var right = chart.chartArea.right;
          var bottom = chart.chartArea.bottom;
          var val = chart.data.datasets[0].data[0];
          c.save();
          c.font = "bold 28px -apple-system, BlinkMacSystemFont, sans-serif";
          c.fillStyle = "#e6edf3";
          c.textAlign = "center";
          c.textBaseline = "bottom";
          c.fillText(val + "%", (left + right) / 2, bottom);
          c.restore();
        }
      }],
    });
  }

  function labelFor(ts) {
    var d = new Date(ts);
    if (rangeHours > 24) {
      return (d.getMonth() + 1) + "/" + d.getDate() + " " + zeroPad2(d.getHours()) + ":00";
    }
    return zeroPad2(d.getHours()) + ":" + zeroPad2(d.getMinutes());
  }

  function refreshCharts() {
    var requestId = ++chartRequestSeq;
    fetchJSON("/api/history?hours=" + rangeHours)
      .then(function (rows) {
        if (requestId !== chartRequestSeq) return;
        var labels = rows.map(function (r) { return labelFor(r.timestamp); });
        var setData = function (chart, key) {
          chart.data.labels = labels;
          chart.data.datasets[0].data = rows.map(function (r) { return r[key]; });
          chart.update();
        };
      setData(charts.battery, "battery_percent");
      setData(charts.solar, "solar_power_w");
      setData(charts.acOut, "ac_power_out_w");
      setData(charts.acIn, "ac_power_in_w");
      setData(charts.temp, "temperature_c");

      // DC Output: sum of dc1 + dc2
      charts.dcOut.data.labels = labels;
      charts.dcOut.data.datasets[0].data = rows.map(function (r) { return (r.dc1_power_out_w || 0) + (r.dc2_power_out_w || 0); });
      charts.dcOut.update();

      // USB multi-line
      charts.usb.data.labels = labels;
      charts.usb.data.datasets[0].data = rows.map(function (r) { return r.usba1_power_w || 0; });
      charts.usb.data.datasets[1].data = rows.map(function (r) { return r.usba2_power_w || 0; });
      charts.usb.data.datasets[2].data = rows.map(function (r) { return r.usbc1_power_w || 0; });
      charts.usb.data.datasets[3].data = rows.map(function (r) { return r.usbc2_power_w || 0; });
      charts.usb.data.datasets[4].data = rows.map(function (r) { return r.usbc3_power_w || 0; });
      charts.usb.update();
      updateEstimatedTimeRemaining(rows);
    })
    .catch(function (e) {
      console.error("charts", e);
    });
  }

  function initControls() {
    var buttons = document.querySelectorAll("#rangeControls button");
    Array.prototype.forEach.call(buttons, function (btn) {
      btn.addEventListener("click", function () {
        Array.prototype.forEach.call(buttons, function (b) { b.classList.remove("active"); });
        btn.classList.add("active");
        rangeHours = parseInt(btn.dataset.hours, 10);
        refreshCharts();
      });
    });
  }

  window.addEventListener("DOMContentLoaded", function () {
    if (typeof Chart !== "undefined") {
      var major = parseInt((Chart.version || "2").split(".")[0], 10);
      chartIsV2 = !isFiniteNumber(major) || major < 3;
      charts.battery = buildChart("chartBattery", "#3fb950");
      charts.solar = buildChart("chartSolar", "#f0883e");
      charts.acOut = buildChart("chartAcOut", "#58a6ff");
      charts.acIn = buildChart("chartAcIn", "#a371f7");
      charts.dcOut = buildChart("chartDcOut", "#f0883e");
      charts.temp = buildChart("chartTemp", "#f85149");
      charts.usb = buildMultiChart("chartUsb", [
        { label: "USB-A1", color: "#58a6ff" },
        { label: "USB-A2", color: "#3fb950" },
        { label: "USB-C1", color: "#f0883e" },
        { label: "USB-C2", color: "#a371f7" },
        { label: "USB-C3", color: "#ffa657" },
      ]);
      charts.batteryHealth = buildGauge("chartBatteryHealth");
    } else {
      var chartsContainer = document.getElementById("charts");
      if (chartsContainer) {
        chartsContainer.innerHTML = '<div class="chart-panel"><h3>Charts unavailable on this browser</h3></div>';
      }
    }
    initControls();
    refreshStatus();
    refreshCharts();
    setInterval(refreshStatus, 30000);
    setInterval(refreshCharts, 60000);
    makeDraggable("cards", "solix-cards-order");
    makeDraggable("charts", "solix-charts-order");
  });

  // ---- Drag-and-drop panel reordering ----
  function closestDataIdElement(node) {
    while (node && node !== document && node !== null) {
      if (node.getAttribute && node.getAttribute("data-id")) return node;
      node = node.parentNode;
    }
    return null;
  }

  function findByDataId(container, id) {
    var children = container.children;
    for (var i = 0; i < children.length; i++) {
      if (children[i].getAttribute("data-id") === id) return children[i];
    }
    return null;
  }

  function makeDraggable(containerId, storageKey) {
    var container = document.getElementById(containerId);
    if (!container) return;

    var dragSrc = null;

    function saveOrder() {
      var ids = [];
      var i;
      for (i = 0; i < container.children.length; i++) {
        ids.push(container.children[i].dataset.id);
      }
      localStorage.setItem(storageKey, JSON.stringify(ids));
    }

    function restoreOrder() {
      var saved = localStorage.getItem(storageKey);
      if (!saved) return;
      try {
        var ids = JSON.parse(saved);
        for (var i = 0; i < ids.length; i++) {
          var el = findByDataId(container, ids[i]);
          if (el) container.appendChild(el);
        }
      } catch (e) { /* ignore corrupt storage */ }
    }

    container.addEventListener("dragstart", function (e) {
      dragSrc = closestDataIdElement(e.target);
      if (!dragSrc) return;
      dragSrc.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", dragSrc.dataset.id);
    });

    container.addEventListener("dragend", function () {
      if (dragSrc) dragSrc.classList.remove("dragging");
      Array.prototype.forEach.call(container.querySelectorAll(".drag-over"), function (el) { el.classList.remove("drag-over"); });
      dragSrc = null;
    });

    container.addEventListener("dragover", function (e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      var target = closestDataIdElement(e.target);
      if (!target || target === dragSrc) return;
      Array.prototype.forEach.call(container.querySelectorAll(".drag-over"), function (el) { el.classList.remove("drag-over"); });
      target.classList.add("drag-over");
    });

    container.addEventListener("dragleave", function (e) {
      var target = closestDataIdElement(e.target);
      if (target) target.classList.remove("drag-over");
    });

    container.addEventListener("drop", function (e) {
      e.preventDefault();
      var target = closestDataIdElement(e.target);
      if (!target || !dragSrc || target === dragSrc) return;
      target.classList.remove("drag-over");
      // Insert dragSrc before or after target based on pointer position
      var rect = target.getBoundingClientRect();
      var after = e.clientY > rect.top + rect.height / 2;
      if (after) {
        container.insertBefore(dragSrc, target.nextSibling);
      } else {
        container.insertBefore(dragSrc, target);
      }
      saveOrder();
    });

    restoreOrder();
  }
})();

  // ---- End drag-and-drop ----
</script>
</body>
</html>
