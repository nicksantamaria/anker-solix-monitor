name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: go

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
        include:
          - goos: linux
            goarch: arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build solix-cli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w -extldflags=-static" \
            -o dist/solix-cli-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/solix-cli

      - name: Build solix-monitor
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w -extldflags=-static" \
            -o dist/solix-monitor-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/solix-monitor

      - name: Upload to release
        run: |
          gh release upload ${{ needs.release-please.outputs.tag_name }} \
            dist/solix-cli-${{ matrix.goos }}-${{ matrix.goarch }} \
            dist/solix-monitor-${{ matrix.goos }}-${{ matrix.goarch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
