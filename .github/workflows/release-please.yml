name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: go

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            cgo_enabled: 0
            ldflags: "-s -w -extldflags=-static"
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
            cgo_enabled: 0
            ldflags: "-s -w -extldflags=-static"
          - goos: linux
            goarch: arm
            runner: ubuntu-latest
            cgo_enabled: 0
            ldflags: "-s -w -extldflags=-static"
          - goos: linux
            goarch: arm
            goarm: 6
            suffix: v6
            runner: ubuntu-latest
            cgo_enabled: 0
            ldflags: "-s -w -extldflags=-static"
          - goos: darwin
            goarch: amd64
            runner: macos-latest
            cgo_enabled: 1
            ldflags: "-s -w"
          - goos: darwin
            goarch: arm64
            runner: macos-latest
            cgo_enabled: 1
            ldflags: "-s -w"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build solix-cli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: ${{ matrix.cgo_enabled }}
        run: |
          go build -ldflags="${{ matrix.ldflags }}" \
            -o dist/solix-cli-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} \
            ./cmd/solix-cli

      - name: Build solix-monitor
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: ${{ matrix.cgo_enabled }}
        run: |
          go build -ldflags="${{ matrix.ldflags }}" \
            -o dist/solix-monitor-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} \
            ./cmd/solix-monitor

      - name: Upload to release
        run: |
          gh release upload ${{ needs.release-please.outputs.tag_name }} \
            dist/solix-cli-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} \
            dist/solix-monitor-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
