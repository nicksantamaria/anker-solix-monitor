name: Release Binaries

on:
  workflow_run:
    workflows: ["Release Please"]
    types:
      - completed

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
        include:
          - goos: linux
            goarch: arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Get release tag
        id: tag
        run: |
          TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName')
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build solix-cli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w -extldflags=-static" \
            -o dist/solix-cli-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/solix-cli

      - name: Build solix-monitor
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w -extldflags=-static" \
            -o dist/solix-monitor-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/solix-monitor

      - name: Upload to release
        run: |
          gh release upload ${{ steps.tag.outputs.tag }} \
            dist/solix-cli-${{ matrix.goos }}-${{ matrix.goarch }} \
            dist/solix-monitor-${{ matrix.goos }}-${{ matrix.goarch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
